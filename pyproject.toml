[project]
name = "arkadyjarvis"
version = "0.1.0"
description = "Multi-user Telegram bot for chat summarization, Bitrix24/Jira integration"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "aiosqlite>=0.20,<1",
    "openai>=1.60,<2",
    "httpx>=0.28,<1",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.7,<3",
    "cryptography>=43,<44",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
